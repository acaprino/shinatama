# Shinatama workspace. verify/H27/driver and verify/H27/shim are separate probes with their own [workspace].
# The session-interchange library no longer lives here: it is published on its own as the `mukade`
# crate (https://github.com/acaprino/mukade). The terminal prototype does not read agent sessions.
[workspace]
resolver = "3"
# The terminal engine remains independent of the Tauri shell (ADR-0005).
members = ["crates/terminal", "crates/projects", "crates/state", "apps/desktop/src-tauri"]
default-members = ["crates/terminal"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "UNLICENSED"

# The only dependencies the workspace crates may use; adding one is a decision, not a side effect.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
# Dependency inventory: THIRD_PARTY_NOTICES.md; full release audit remains register X3.
portable-pty = "0.9"
tauri = "2.9"
tauri-build = "2.5"
tauri-plugin-dialog = "=2.8.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_SystemInformation"] }
libc = "0.2"
shinatama-terminal = { path = "crates/terminal" }
shinatama-projects = { path = "crates/projects" }
shinatama-state = { path = "crates/state" }
