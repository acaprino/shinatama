name: Verify Windows

# Every push to develop, every pull request into develop, and by hand. The release pull request (develop into main) is
# not run: it is the commit the push to develop has just verified, and the release workflow builds and publishes
# without running the tests again. Nothing waits for it: main has no required check.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify Windows x64
    runs-on: windows-2025
    # Every check runs even after one fails (scripts/verify.ps1), and a run with no cargo cache compiles the workspace
    # from nothing.
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      # No incremental state: the cached target stays smaller, and the same for the same inputs.
      CARGO_INCREMENTAL: '0'

    steps:
      # Full history is required to validate real commit SHAs in progress.json.
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # rustup resolves and installs the channel/components in rust-toolchain.toml.
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      # Cargo's dependency build is kept between runs. The key has two parts. The compiler: another Rust makes every
      # artifact of the old one useless, and a key without it would still hit and never be saved again. The dependencies:
      # the source and checksum lines of Cargo.lock, not the whole file, which also holds the version of every crate of
      # this workspace and which the release rewrites each time.
      - name: Cargo cache key
        id: cargo-key
        run: |
          $info = rustc -vV
          if ($LASTEXITCODE) { exit 1 }
          $release = ($info | Select-String '^release: (\S+)').Matches[0].Groups[1].Value
          $commit = ($info | Select-String '^commit-hash: (\w{9})').Matches[0].Groups[1].Value
          $pins = Select-String -Path Cargo.lock -Pattern '^(source|checksum) = ' | ForEach-Object Line
          $lock = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($pins -join "`n"))).Substring(0, 20).ToLower()
          "toolchain=$release-$commit" >> $env:GITHUB_OUTPUT
          "lock=$lock" >> $env:GITHUB_OUTPUT

      # scripts/verify.ps1 builds the debug profile (clippy, the tests, the desktop) and, in the same run, the release
      # profile of the session helper: each has a cache of its own, so that neither carries the other. The registry and
      # the git database go with the debug one. A cache is saved by a run that succeeds, and only when none of the exact
      # key exists; the crates of this workspace are compiled at every run (their sources are new at every checkout),
      # what the cache gives back is the dependencies. When the lock moves, the restore key starts from the last build.
      - name: Restore the compiled Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
          key: ${{ runner.os }}-cargo-verify-${{ steps.cargo-key.outputs.toolchain }}-${{ steps.cargo-key.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-verify-${{ steps.cargo-key.outputs.toolchain }}-

      - name: Restore the compiled Rust release build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release
          key: ${{ runner.os }}-cargo-verify-release-${{ steps.cargo-key.outputs.toolchain }}-${{ steps.cargo-key.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-verify-release-${{ steps.cargo-key.outputs.toolchain }}-

      - name: Run the shared local and CI verification entrypoint
        run: ./scripts/verify.ps1 -TimeoutMinutes 140

      # Deliberate allowlist: never upload WebView profiles, app settings or the application's logs.
      # .verification/logs holds the whole output of each check (the run's log shows only the end of a failed one).
      - name: Upload verification reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-windows-${{ github.sha }}
          path: |
            .verification/verification.json
            .verification/dependencies.json
            .verification/logs/*.log
            .prototype-evidence/desktop-terminals.png
            .prototype-evidence/projects-picker.png
            .prototype-evidence/project-catalog.json
            .prototype-evidence/new-project.json
            .prototype-evidence/launch-preflight.json
            .prototype-evidence/resources-observer.json
            .prototype-evidence/maintenance.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # Uploaded whenever it was built: the verification report beside it says which checks passed.
      - name: Upload embedded prototype executable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shinatama-prototype-debug-windows-x64-${{ github.sha }}
          path: |
            target/debug/shinatama-desktop.exe
            target/debug/shinatama.exe
            target/debug/shinatama-session-helper.exe
            target/release/shinatama-session-helper.exe
            THIRD_PARTY_NOTICES.md
            .verification/THIRD_PARTY_LICENSES.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
