[package]
name = "shinatama-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
# Explicit test build only; no fixture commands or assets in the product build.
tl1-proof = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
imago-shell = { git = "https://github.com/acaprino/imago.git", rev = "2902a11ddb0ace2b2a36dcb0f840c13ccb0f949d" }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
uuid.workspace = true
shinatama-terminal.workspace = true
shinatama-projects.workspace = true
shinatama-state.workspace = true
shinatama-engine = { workspace = true, features = ["session-reader"] }
shinatama-adapter.workspace = true
shinatama-export.workspace = true
shinatama-hop.workspace = true
shinatama-files.workspace = true
shinatama-browser.workspace = true
shinatama-xiox.workspace = true
base64.workspace = true
# WHATWG URL parsing for the agents' browser address check (ADR-0056); the version Tauri already links. MIT OR Apache-2.0.
url.workspace = true
sha2.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# The versions Tauri itself links: one WebView2 binding in the executable.
webview2-com.workspace = true
windows-core.workspace = true
